name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scan.outputs.scope }}
      render: ${{ steps.scan.outputs.render }}
      full_gate: ${{ steps.scan.outputs.full_gate }}
    steps:
      - name: Checkout (full clone)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Determine change scope
        id: scan
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
          # A `.before` removed by a force-push (or absent from a shallow clone) is a
          # "bad object": `rev-parse --verify` can still resolve it while `git diff`
          # exits 128. Verify the object actually exists; if not, fall back to the
          # empty tree (=> all paths => code => full gate), never silently skip a gate.
          if [ -z "$BEFORE" ] || ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1 \
            || ! git cat-file -e "$BEFORE" >/dev/null 2>&1; then
            BEFORE=4b825dc642cb6eb9a060e54bf8d69288fbee4904 # git empty-tree SHA
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" \
            | uv run --no-sync python -m tools.ci_git_diff_scope > "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [test, ci-scan]
    if: needs.ci-scan.outputs.scope == 'code'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just sync
      - run: just build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(uv run python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
          TAG="v${VERSION}"
          if gh release view "$TAG" 2>/dev/null; then
            echo "Release $TAG already exists, updating assets..."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "oc-selector $VERSION"
          fi
