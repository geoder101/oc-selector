name: Documentation Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - name: Authorize the deployment event
        id: authorize
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Only push and workflow_dispatch events are authorized.
          case "$EVENT_NAME" in
            push | workflow_dispatch) ;;
            *)
              echo "::error::Unauthorized event name: $EVENT_NAME"
              exit 1
              ;;
          esac
          # Only the repository's actual default branch is authorized.
          expected_ref="refs/heads/${DEFAULT_BRANCH}"
          if [ "$EVENT_REF" != "$expected_ref" ]; then
            echo "::error::Unauthorized ref: $EVENT_REF (expected $expected_ref)"
            exit 1
          fi
          # The event SHA must be a 40-character lowercase hex string.
          if ! [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unauthorized SHA: $EVENT_SHA"
            exit 1
          fi
          echo "sha=${EVENT_SHA}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the authorized SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Verify the checkout matches the authorized SHA
        env:
          AUTHORIZED_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$AUTHORIZED_SHA" ]; then
            echo "::error::HEAD $head_sha does not match authorized SHA $AUTHORIZED_SHA"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean"
            exit 1
          fi
      - name: Set up uv
        uses: astral-sh/setup-uv@4e3dbecc19008549e0deaff33911d7a8662627b2 # v5.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - name: Sync the locked environment
        run: just sync
      - name: Build the docs site strictly
        run: just docs-check
      - name: Upload the docs site
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: github-pages
          path: docs/_build/html

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download the docs site
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: github-pages
          path: docs/_build/html
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
        with:
          path: docs/_build/html
