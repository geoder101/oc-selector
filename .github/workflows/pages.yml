name: Documentation Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  ci-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      render: ${{ steps.scan.outputs.render }}
    steps:
      - name: Checkout (full clone)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Determine change scope
        id: scan
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$BEFORE" ] || ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1; then
            BEFORE=4b825dc642cb6eb9a060e54bf8d69288fbee4904 # git empty-tree SHA
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" \
            | uv run --no-sync python -m tools.ci_git_diff_scope > "$GITHUB_OUTPUT"

  authorize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm default-branch deployment
        run: echo "Authorized documentation deployment from the default branch."

  build:
    needs: [authorize, ci-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      render: ${{ needs.ci-scan.outputs.render }}
    steps:
      - if: needs.ci-scan.outputs.render == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - if: needs.ci-scan.outputs.render == 'true'
        uses: ./.github/actions/setup
      - if: needs.ci-scan.outputs.render == 'true'
        run: just sync
      - if: needs.ci-scan.outputs.render == 'true'
        name: Build the docs site
        run: just docs-check
      - if: needs.ci-scan.outputs.render == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: docs/_build/html
          if-no-files-found: warn

  deploy:
    if: needs.build.outputs.render == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the docs site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
