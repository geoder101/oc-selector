name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  ci-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scan.outputs.scope }}
      render: ${{ steps.scan.outputs.render }}
      full_gate: ${{ steps.scan.outputs.full_gate }}
    steps:
      - name: Checkout (full clone)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Determine change scope
        id: scan
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$BEFORE" ] || ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1; then
            BEFORE=4b825dc642cb6eb9a060e54bf8d69288fbee4904 # git empty-tree SHA
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" \
            | uv run --no-sync python -m tools.ci_git_diff_scope > "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: ci-scan
    if: ${{ github.event_name == 'pull_request' || needs.ci-scan.outputs.full_gate == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just sync
      - run: just check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci-scan
    if: ${{ needs.ci-scan.outputs.full_gate == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just sync
      - run: just coverage-check
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/html/
            coverage/coverage.json
            coverage/.coverage
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
