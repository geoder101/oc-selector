name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the event SHA
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.59.0
      - name: Sync the locked environment
        run: just sync
      - name: Run the single gate
        run: just check

  coverage:
    name: Coverage evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event SHA
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.59.0
      - name: Sync the locked environment
        run: just sync
      - name: Run the 90% combined coverage gate
        run: just coverage-check
      - name: Upload the coverage evidence
        if: always()
        uses: actions/upload-artifact@v4.5.0
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/html/
            coverage/coverage.json
            coverage/.coverage
          include-hidden-files: true
          retention-days: 7
