name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the event SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@4e3dbecc19008549e0deaff33911d7a8662627b2 # v5.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - name: Sync the locked environment
        run: just sync
      - name: Run the single gate
        run: just check

  coverage:
    name: Coverage evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@4e3dbecc19008549e0deaff33911d7a8662627b2 # v5.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - name: Sync the locked environment
        run: just sync
      - name: Run the 90% combined coverage gate
        run: just coverage-check
      - name: Upload the coverage evidence
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/html/
            coverage/coverage.json
            coverage/.coverage
          include-hidden-files: true
          retention-days: 7
