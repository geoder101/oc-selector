name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: ./.github/actions/setup
        with:
          just-version: "1.59.0"
      - name: Sync the locked environment
        run: just sync
      - name: Run the single gate
        run: just check

  coverage:
    name: Coverage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup
        with:
          just-version: "1.59.0"
      - name: Sync the locked environment
        run: just sync
      - name: Run the 90% combined coverage gate
        run: just coverage-check
      - name: Upload the coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/html/
            coverage/coverage.json
            coverage/.coverage
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
