# Composite action: set up the CI toolchain (checkout + uv + just).
#
# Shared by ci.yml and release.yml so the pinned toolchain is declared in one
# place and bumped in one step. Used inline with `uses: ./.github/actions/setup`
# so the installed `uv` and `just` stay on PATH for the caller's `run:` steps.
name: Set up toolchain
description: Check out the event SHA and install the uv/just CI toolchain.

inputs:
  python-version:
    description: Python version to install via setup-uv.
    required: false
    default: "3.12"
  persist-credentials:
    description: Disable persisted checkout credentials.
    required: false
    default: "false"
  just-version:
    description: Just version to install; leave empty to skip this step.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check out the event SHA
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: ${{ inputs.persist-credentials }}
    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    - name: Set up just
      if: ${{ inputs.just-version != '' }}
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: ${{ inputs.just-version }}
