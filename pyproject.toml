[project]
name = "oc-selector"
version = "0.1.0"
description = "Cross-platform command that selects registered OpenCode settings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "tomlkit>=0.12",
    "json-five==1.1.2",
    "portalocker>=2.8",
    "jsonschema>=4.0",
]

[project.scripts]
oc-selector = "oc_selector.cli:main"

[build-system]
# Bounded so a future breaking uv_build major can't break the sdist build.
requires = ["uv_build>=0.4.4,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "basedpyright>=0.16",
    "coverage[toml]==7.17.0",
    "pytest-cov==7.1.0",
]
docs = [
    "furo==2025.12.19",
    "sphinx==9.1.1",
    "sphinx-autoapi==3.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
# Copyright is tracked in the LICENSE file, not per-file headers.
# select=["ALL"] pulls in both members of two incompatible pydocstyle pairs.
# D203 and D213 are the losers, dropped explicitly (keeping D211: one blank
# line before a class; D212: summary on the first line). This makes ruff's
# automatic resolution explicit and silences the "incompatible" warnings.
# COM812 overlaps the formatter's jurisdiction over trailing commas and makes
# `ruff format` emit a standing conflict warning. The formatter already owns
# trailing-comma layout (respecting magic trailing commas), so the rule is
# dropped to silence the warning; trailing commas are no longer lint-enforced.
# TRY003/EM101/EM102 conflict with each other and with Python's natural
# exception-raising pattern; messages are kept inline for clarity.
ignore = ["CPY001", "COM812", "D203", "D213", "TRY003", "EM101", "EM102"]

[tool.ruff.lint.per-file-ignores]
# Test code may assert, compare against small literals, and use fixed temp names.
# tests/ is an implicit namespace package (no __init__.py by design) and the
# harness intentionally runs subprocesses against trusted fixture executables.
# D102 (missing docstring in method) is noise for test methods.
"tests/**" = ["S101", "PLR2004", "S108", "INP001", "S603", "D102", "D101"]
# tools/verify.py is a subprocess evidence recorder; it intentionally shells out
# to arbitrary commands and writes to caller-supplied evidence paths.
"tools/verify.py" = ["S603", "S607", "S108", "INP001"]
# Shell completion scripts are inherently long single-line constructs.
"src/oc_selector/completion.py" = ["E501"]
# docs/conf.py is a Sphinx config file, not a package module; docs/ has no
# __init__.py by design, so the implicit-namespace-package check is a false positive.
"docs/conf.py" = ["INP001"]

[tool.coverage.run]
branch = true
source = ["oc_selector"]

[tool.coverage.report]
# Coverage audit (T17): the combined statement+branch gate passes at the
# recorded 93.5995623632385% with NO line-level exclusions for the
# platform-unreachable lines (process.py win32/execve paths; cli.py dead
# guards and the __main__ guard); those lines stay in the denominator as
# uncovered. The only exclusion in this config is the line-level `case _:`
# + `assert_never()` dead-code-guard regex below (a dead-code proof, not
# untested behavior). Any future exclusion must be line-level only, never
# whole-file/whole-function.
exclude_also = [
    # (?m:^[ \t]*case _:[ \t]*\r?\n[ \t]+assert_never\(
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
# Fail the suite on any unhandled Python warning (including ResourceWarning and
# unraisable exceptions). Every warning must be fixed at its source; a precise
# filter below is only acceptable for an unavoidable third-party warning.
filterwarnings = ["error"]
markers = [
    "real_runtime: tests requiring real pinned runtime (VM only)",
    "console: tests requiring terminal/pty interaction",
    "container: tests requiring a prebuilt podman image (see `just completion-e2e-image`)",
]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "all"
include = ["src", "tests", "tools"]
# tests/ holds the helpers package and conftest; expose it as a source root so
# `helpers.*` and `conftest` resolve as absolute imports (tests/ has no __init__).
extraPaths = ["tests"]
reportMissingTypeStubs = false
# write_text / sys.stdout.write / parser.add_argument intentionally ignore their
# return values; this basedpyright-specific rule is noise for those patterns.
reportUnusedCallResult = "none"
